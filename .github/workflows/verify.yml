name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: cargo install cargo-zigbuild --locked
      - run: bun run verify:portable
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64-glibc-2.17
          path: prebuilds/linux-x64-gnu/opentui_markdown_render.node
          if-no-files-found: error
